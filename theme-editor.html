<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudy Theme · Editor de colores</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --editorBg:#18171e; --tabsBg:#141319; --text:#bcbec4; --selection:#322f48;
    --lineHl:#252629; --lineNumber:#4e5157; --borders:#3c3f41; --accent:#8a6cf0;
    --comment:#7a7e85; --string:#6aab73; --keyword:#cf8e6d; --function:#5c9ef0;
    --type:#c77dbb; --number:#2aacb8; --decorator:#bbb529;
    --error:#f75464; --warning:#e8a33e; --gitAdded:#73b00a;
  }
  body { font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    background:#0f0e13; color:#d9d7e0; height:100vh; display:flex; flex-direction:column; }
  header { padding:13px 22px; border-bottom:1px solid #2a2733;
    display:flex; align-items:center; gap:10px; }
  header .dot { width:14px; height:14px; border-radius:5px; background:var(--accent); }
  header h1 { font-size:15px; font-weight:600; }
  header .sub { font-size:12px; color:#7e7b8c; flex:1; }
  #status { font-size:12px; opacity:0; transition:opacity .3s; }
  .app { flex:1; display:flex; min-height:0; }

  .controls { width:312px; flex-shrink:0; overflow-y:auto; border-right:1px solid #2a2733; padding:14px; }
  .themebar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tpill { padding:6px 11px; border-radius:7px; background:#1b1a22; border:1px solid #2a2733;
    color:#9b98a8; font-size:12px; cursor:pointer; }
  .tpill.on { background:var(--accent); color:#fff; border-color:transparent; }
  .gtitle { font-size:11px; text-transform:uppercase; letter-spacing:1px;
    color:#7e7b8c; margin:16px 0 6px; font-weight:700; }
  .ctl { display:flex; align-items:center; gap:10px; padding:4px 6px; border-radius:7px;
    transition:background .15s; }
  .ctl:hover { background:#1c1b24; }
  .ctl label { flex:1; font-size:13px; }
  .ctl input[type=color] { width:30px; height:30px; border:none; border-radius:8px;
    background:none; cursor:pointer; padding:0; }
  .ctl input[type=color]::-webkit-color-swatch { border:1px solid #3a3745; border-radius:8px; }
  .ctl input[type=text] { width:80px; background:#1b1a22; border:1px solid #2a2733;
    color:#d9d7e0; border-radius:6px; padding:5px 7px; font-family:ui-monospace,monospace; font-size:12px; }
  .fxhint { font-size:11px; color:#7e7b8c; min-height:16px; margin:10px 0 4px; }
  .actions { display:flex; gap:8px; margin-top:6px; }
  .actions button { flex:1; padding:10px; border-radius:8px; border:none; cursor:pointer;
    font-size:12.5px; font-weight:600; }
  .btn-save { background:var(--accent); color:#fff; }
  .btn-reset { background:#26242f; color:#d9d7e0; }

  .preview { flex:1; padding:24px; overflow:auto; }
  .vscode { border-radius:12px; overflow:hidden; border:1px solid #2a2733;
    box-shadow:0 14px 44px rgba(0,0,0,.55); background:var(--editorBg);
    display:flex; flex-direction:column; min-height:440px; }
  .vs-tabs { display:flex; background:var(--tabsBg); overflow-x:auto; }
  .vs-tab { padding:9px 14px; font-size:12px; color:var(--comment); cursor:pointer;
    border-right:1px solid #00000033; white-space:nowrap; display:flex; gap:7px; align-items:center; }
  .vs-tab.active { background:var(--editorBg); color:var(--text); }
  .vs-tab .x { opacity:.5; font-weight:700; }
  .vs-tab .x:hover { opacity:1; }
  .vs-tab-add { color:var(--accent); font-weight:600; }
  .vs-body { display:flex; flex:1; }
  .vs-activitybar { width:46px; background:var(--tabsBg); padding:10px 0;
    display:flex; flex-direction:column; align-items:center; gap:14px; }
  .vs-ai { width:24px; height:24px; border-radius:6px; background:#ffffff14; }
  .vs-ai.on { background:var(--accent); }
  .vs-sidebar { width:158px; background:var(--editorBg); padding:12px 8px;
    border-right:1px solid var(--borders); }
  .vs-side-title { font-size:10px; letter-spacing:1px; color:var(--comment); margin-bottom:8px; padding-left:6px; }
  .vs-file { font-size:12.5px; color:var(--text); padding:3px 6px; border-radius:5px; }
  .vs-file.indent { padding-left:18px; }
  .vs-file.on { background:var(--accent); color:#fff; }
  .vs-editor { flex:1; display:flex; font-family:ui-monospace,"Cascadia Code",monospace;
    font-size:13px; background:var(--editorBg); }
  .vs-gutter { padding:14px 10px 14px 16px; text-align:right; color:var(--lineNumber);
    user-select:none; line-height:1.7; white-space:pre; }
  .vs-code { padding:14px 16px; line-height:1.7; flex:1; white-space:pre; color:var(--text);
    overflow-x:auto; }
  .ln { display:block; }
  .ln.active { background:var(--lineHl); margin:0 -16px; padding:0 16px; }
  .cm{color:var(--comment);font-style:italic} .st{color:var(--string)} .kw{color:var(--keyword)}
  .fn{color:var(--function)} .ty{color:var(--type)} .nu{color:var(--number)}
  .de{color:var(--decorator)} .va{color:var(--text)}
  .sel{ background:var(--selection); border-radius:2px; }
  .hljs-comment,.hljs-quote{color:var(--comment);font-style:italic}
  .hljs-string,.hljs-regexp,.hljs-meta .hljs-string{color:var(--string)}
  .hljs-keyword,.hljs-literal,.hljs-built_in,.hljs-name,.hljs-tag,.hljs-selector-tag,.hljs-symbol,.hljs-bullet{color:var(--keyword)}
  .hljs-title,.hljs-title.function_,.hljs-section{color:var(--function)}
  .hljs-title.class_,.hljs-type,.hljs-class .hljs-title{color:var(--type)}
  .hljs-attr,.hljs-attribute,.hljs-property,.hljs-selector-attr,.hljs-selector-class,.hljs-selector-id{color:var(--type)}
  .hljs-number{color:var(--number)}
  .hljs-variable,.hljs-template-variable,.hljs-params{color:var(--text)}
  .hljs-meta,.hljs-doctag{color:var(--decorator)}
  .hljs-deletion{color:var(--error)} .hljs-addition{color:var(--gitAdded)}
  .vs-diag { display:flex; gap:8px; padding:8px 14px; background:var(--tabsBg);
    font-size:11px; border-top:1px solid #00000033; }
  .chip { padding:2px 9px; border-radius:20px; color:#fff; }
  .chip-err{ background:var(--error) } .chip-warn{ background:var(--warning); color:#18171e }
  .chip-git{ background:var(--gitAdded); color:#18171e }
  .vs-statusbar { background:var(--accent); color:#fff; font-size:11px; padding:4px 14px; }
  .fxhi { outline:2px solid #fff; outline-offset:1px; box-shadow:0 0 0 4px rgba(255,255,255,.25);
    border-radius:3px; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 7px rgba(255,255,255,.12); } }
</style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>Claudy Theme</h1>
    <span class="sub">· editor de colores</span>
    <span id="status"></span>
  </header>
  <div class="app">
    <aside class="controls" id="controls"></aside>
    <main class="preview">
      <div class="vscode">
        <div class="vs-tabs" id="tabs"></div>
        <div class="vs-body">
          <div class="vs-activitybar">
            <div class="vs-ai on"></div><div class="vs-ai"></div><div class="vs-ai"></div>
          </div>
          <div class="vs-sidebar">
            <div class="vs-side-title">EXPLORADOR</div>
            <div class="vs-file">src</div>
            <div class="vs-file indent on">archivo</div>
            <div class="vs-file indent">otro</div>
            <div class="vs-file">themes</div>
          </div>
          <div class="vs-editor">
            <div class="vs-gutter" id="gutter"></div>
            <pre class="vs-code" id="code"></pre>
          </div>
        </div>
        <div class="vs-diag">
          <span class="chip chip-err">3 errores</span>
          <span class="chip chip-warn">1 alerta</span>
          <span class="chip chip-git">+12 lineas</span>
        </div>
        <div class="vs-statusbar">Claudy · UTF-8</div>
      </div>
    </main>
  </div>
  <input type="file" id="fileInput" style="display:none"
    accept=".ts,.tsx,.js,.jsx,.css,.scss,.less,.html,.xml,.json,.py,.md,.go,.rs,.java,.php,.rb,.sh,.yml,.yaml,.sql,.c,.cpp,.txt">

<script src="vendor/highlight.min.js"></script>
<script>
/* metadata de cada color (label, grupo, que ilumina en hover) */
const META = {
  editorBg:  {label:'Fondo del editor', group:'Fondos', fx:'.vs-editor,.vs-sidebar'},
  tabsBg:    {label:'Fondo de tabs',    group:'Fondos', fx:'.vs-tabs'},
  text:      {label:'Texto / variables',group:'Fondos', fx:'.va,.hljs-variable'},
  selection: {label:'Selección',        group:'Fondos', fx:'.sel'},
  lineHl:    {label:'Línea actual',     group:'Fondos', fx:'.ln.active'},
  lineNumber:{label:'Números de línea', group:'Fondos', fx:'.vs-gutter'},
  borders:   {label:'Bordes',           group:'Fondos', fx:'.vs-sidebar'},
  accent:    {label:'Acento',           group:'Acento', fx:'.vs-statusbar,.vs-ai.on,.vs-file.on'},
  comment:   {label:'Comentarios',      group:'Sintaxis', fx:'.cm,.hljs-comment'},
  string:    {label:'Strings',          group:'Sintaxis', fx:'.st,.hljs-string'},
  keyword:   {label:'Keywords',         group:'Sintaxis', fx:'.kw,.hljs-keyword'},
  function:  {label:'Funciones',        group:'Sintaxis', fx:'.fn,.hljs-title'},
  type:      {label:'Tipos / clases',   group:'Sintaxis', fx:'.ty,.hljs-attr'},
  number:    {label:'Números',          group:'Sintaxis', fx:'.nu,.hljs-number'},
  decorator: {label:'Decoradores',      group:'Sintaxis', fx:'.de,.hljs-meta'},
  error:     {label:'Error',            group:'Diagnóstico', fx:'.chip-err'},
  warning:   {label:'Alerta',           group:'Diagnóstico', fx:'.chip-warn'},
  gitAdded:  {label:'Git (agregado)',   group:'Diagnóstico', fx:'.chip-git'},
};
/* paleta original de cada tema */
const THEMES = {
  'claudy-dark':   {label:'Dark',  editorBg:'#18171e',tabsBg:'#141319',text:'#bcbec4',selection:'#322f48',lineHl:'#252629',lineNumber:'#4e5157',borders:'#3c3f41',accent:'#8a6cf0',comment:'#7a7e85',string:'#6aab73',keyword:'#cf8e6d',function:'#5c9ef0',type:'#c77dbb',number:'#2aacb8',decorator:'#bbb529',error:'#f75464',warning:'#e8a33e',gitAdded:'#73b00a'},
  'claudy-forest': {label:'Forest',editorBg:'#161915',tabsBg:'#121510',text:'#bcbec4',selection:'#2c3a2d',lineHl:'#1f231d',lineNumber:'#4e5157',borders:'#3c3f41',accent:'#5fa86b',comment:'#7a7e85',string:'#6aab73',keyword:'#cf8e6d',function:'#5c9ef0',type:'#c77dbb',number:'#2aacb8',decorator:'#bbb529',error:'#f75464',warning:'#e8a33e',gitAdded:'#73b00a'},
  'claudy-ocean':  {label:'Ocean', editorBg:'#15171c',tabsBg:'#111318',text:'#bcbec4',selection:'#28384f',lineHl:'#1f2329',lineNumber:'#4e5157',borders:'#3c3f41',accent:'#4a9edb',comment:'#7a7e85',string:'#6aab73',keyword:'#cf8e6d',function:'#5c9ef0',type:'#c77dbb',number:'#2aacb8',decorator:'#bbb529',error:'#f75464',warning:'#e8a33e',gitAdded:'#73b00a'},
  'claudy-minimal':{label:'Minimal',editorBg:'#18171e',tabsBg:'#141319',text:'#bcbec4',selection:'#2f2f36',lineHl:'#252629',lineNumber:'#4e5157',borders:'#3c3f41',accent:'#8b8f9c',comment:'#7a7e85',string:'#8e9e8b',keyword:'#bba593',function:'#90a0b5',type:'#ad97a8',number:'#83a3a6',decorator:'#a6a487',error:'#f75464',warning:'#e8a33e',gitAdded:'#73b00a'},
};
let currentTheme = 'claudy-dark';
/* STATE[tema] = valores actuales (preserva ediciones al cambiar de tema) */
const STATE = {};
for(const t in THEMES){ STATE[t]={}; for(const k in META) STATE[t][k]=THEMES[t][k]; }
const cur = ()=>STATE[currentTheme];

const BUILTIN = {
  'Counter.tsx': { lang:'typescript', code:
`import { useState, useEffect } from "react";

type Props = { start?: number; step?: number };

// contador con efecto secundario
export function Counter({ start = 0, step = 1 }: Props) {
  const [count, setCount] = useState(start);

  useEffect(() => {
    document.title = "Total: " + count;
  }, [count]);

  const inc = () => setCount(count + step);
  return { count, inc };
}` },
  'styles.css': { lang:'css', code:
`/* Claudy · tarjeta */
:root {
  --radius: 14px;
  --gap: 1.5rem;
}

.card {
  background: #18171e;
  border-radius: var(--radius);
  padding: var(--gap);
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-4px);
}

@media (max-width: 640px) {
  .card { padding: 1rem; }
}` },
  'server.js': { lang:'javascript', code:
`const http = require("http");
const PORT = 3000;

// rutas basicas
const routes = {
  "/": "Hola Claudy",
  "/ping": "pong",
};

const server = http.createServer((req, res) => {
  const body = routes[req.url] || "404";
  res.writeHead(body === "404" ? 404 : 200);
  res.end(body);
});

server.listen(PORT, () => console.log("activo en " + PORT));` },
  'app.py': { lang:'python', code:
`import os
from dataclasses import dataclass

@dataclass
class User:
    name: str
    age: int = 0

# saluda al usuario
def greet(user: User) -> str:
    if user.age >= 18:
        return "hola " + user.name
    return "menor de edad"

if __name__ == "__main__":
    print(greet(User("Claudy", 25)))` },
  'config.json': { lang:'json', code:
`{
  "name": "claudy-theme",
  "version": "0.1.0",
  "private": true,
  "themes": ["dark", "forest", "ocean", "minimal"],
  "settings": { "port": 7333, "live": true }
}` },
  'main.go': { lang:'go', code:
`package main

import "fmt"

// suma dos numeros
func add(a, b int) int {
  return a + b
}

func main() {
  total := add(2, 40)
  fmt.Println("total:", total)
}` },
};
const FILES = {};
for(const k in BUILTIN){
  const b = BUILTIN[k];
  let html;
  try { html = hljs.highlight(b.code, {language:b.lang}).value; }
  catch(e){ html = hljs.highlightAuto(b.code).value; }
  FILES[k] = { builtin:true, html, n:(b.code.match(/\n/g)||[]).length + 1 };
}
let currentFile = Object.keys(FILES)[0];
const EXT_LANG = {ts:'typescript',tsx:'typescript',js:'javascript',jsx:'javascript',
  css:'css',scss:'scss',less:'less',html:'xml',xml:'xml',json:'json',py:'python',
  md:'markdown',go:'go',rs:'rust',java:'java',php:'php',rb:'ruby',sh:'bash',
  yml:'yaml',yaml:'yaml',sql:'sql',c:'c',cpp:'cpp'};

const root = document.documentElement;
function apply(){ for(const k in META) root.style.setProperty('--'+k, cur()[k]); }

/* ---- archivos cargados (persisten en el navegador) ---- */
function saveFiles(){
  const ld={}; for(const k in FILES) if(!FILES[k].builtin) ld[k]=FILES[k];
  localStorage.setItem('claudyFiles', JSON.stringify(ld));
}
function restoreFiles(){
  try { const ld=JSON.parse(localStorage.getItem('claudyFiles')||'{}');
    for(const k in ld) FILES[k]=ld[k]; } catch(e){}
}

/* ---- preview ---- */
function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  Object.keys(FILES).forEach(name=>{
    const el=document.createElement('div');
    el.className='vs-tab'+(name===currentFile?' active':'');
    const lbl=document.createElement('span'); lbl.textContent=name;
    lbl.onclick=()=>{ currentFile=name; renderTabs(); renderCode(); };
    el.appendChild(lbl);
    if(!FILES[name].builtin){
      const x=document.createElement('span'); x.className='x'; x.textContent='×';
      x.onclick=e=>{ e.stopPropagation(); delete FILES[name]; saveFiles();
        if(currentFile===name) currentFile=Object.keys(FILES)[0];
        renderTabs(); renderCode(); };
      el.appendChild(x);
    }
    t.appendChild(el);
  });
  const add=document.createElement('div');
  add.className='vs-tab vs-tab-add'; add.textContent='+ archivo';
  add.onclick=()=>document.getElementById('fileInput').click();
  t.appendChild(add);
}
function renderCode(){
  const g=document.getElementById('gutter'), c=document.getElementById('code');
  const f=FILES[currentFile];
  if(!f){ g.textContent=''; c.innerHTML=''; return; }
  g.textContent=Array.from({length:f.n},(_,i)=>i+1).join('\n');
  c.innerHTML=f.html;
}
function loadFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let text=String(r.result).replace(/\t/g,'  ');
    const lines=text.split('\n');
    if(lines.length>240) text=lines.slice(0,240).join('\n')+'\n...';
    const lang=EXT_LANG[(file.name.split('.').pop()||'').toLowerCase()];
    let html;
    try { html=lang?hljs.highlight(text,{language:lang}).value:hljs.highlightAuto(text).value; }
    catch(e){ html=hljs.highlightAuto(text).value; }
    FILES[file.name]={ html, n:(text.match(/\n/g)||[]).length+1 };
    currentFile=file.name; saveFiles(); renderTabs(); renderCode();
  };
  r.readAsText(file);
}
document.getElementById('fileInput').onchange=e=>{
  if(e.target.files[0]) loadFile(e.target.files[0]); e.target.value='';
};

/* ---- controles ---- */
function buildControls(){
  const c=document.getElementById('controls'); c.innerHTML='';
  // selector de tema
  const bar=document.createElement('div'); bar.className='themebar';
  for(const t in THEMES){
    const p=document.createElement('div');
    p.className='tpill'+(t===currentTheme?' on':'');
    p.textContent=THEMES[t].label;
    p.onclick=()=>{ currentTheme=t; apply(); buildControls(); };
    bar.appendChild(p);
  }
  c.appendChild(bar);
  // colores
  let lastG='';
  for(const key in META){
    const m=META[key];
    if(m.group!==lastG){
      const t=document.createElement('div'); t.className='gtitle'; t.textContent=m.group;
      c.appendChild(t); lastG=m.group;
    }
    const row=document.createElement('div'); row.className='ctl';
    const lab=document.createElement('label'); lab.textContent=m.label;
    const pick=document.createElement('input'); pick.type='color'; pick.value=cur()[key];
    const hex=document.createElement('input'); hex.type='text'; hex.value=cur()[key];
    const set=v=>{ cur()[key]=v; pick.value=v; hex.value=v; apply(); };
    pick.oninput=()=>set(pick.value);
    hex.oninput=()=>{ if(/^#[0-9a-fA-F]{6}$/.test(hex.value)) set(hex.value.toLowerCase()); };
    row.onmouseenter=()=>{
      document.querySelectorAll(m.fx).forEach(e=>e.classList.add('fxhi'));
      document.getElementById('fxhint').textContent='→ cambia: '+m.label.toLowerCase();
    };
    row.onmouseleave=()=>{
      document.querySelectorAll('.fxhi').forEach(e=>e.classList.remove('fxhi'));
      document.getElementById('fxhint').textContent='';
    };
    row.append(lab,pick,hex); c.appendChild(row);
  }
  const hint=document.createElement('div'); hint.className='fxhint'; hint.id='fxhint';
  c.appendChild(hint);
  const act=document.createElement('div'); act.className='actions';
  const save=document.createElement('button'); save.className='btn-save';
  save.textContent='Guardar '+THEMES[currentTheme].label;
  const rst=document.createElement('button'); rst.className='btn-reset'; rst.textContent='Reset';
  save.onclick=doSave;
  rst.onclick=()=>{ for(const k in META) cur()[k]=THEMES[currentTheme][k]; apply(); buildControls(); };
  act.append(save,rst); c.appendChild(act);
}

async function doSave(){
  const mapping={};
  for(const k in META) mapping[THEMES[currentTheme][k]] = cur()[k];
  const st=document.getElementById('status');
  try{
    const res=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({theme:currentTheme, mapping})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    st.textContent='Guardado '+THEMES[currentTheme].label+' ✓ — recargá VSCode';
    st.style.color='var(--gitAdded)';
  }catch(e){
    st.textContent='Error al guardar: '+e.message+' (¿corre el server?)';
    st.style.color='var(--error)';
  }
  st.style.opacity=1; setTimeout(()=>st.style.opacity=0,4000);
}

restoreFiles();
if(!FILES[currentFile]) currentFile=Object.keys(FILES)[0];
buildControls(); renderTabs(); renderCode(); apply();
</script>
</body>
</html>
